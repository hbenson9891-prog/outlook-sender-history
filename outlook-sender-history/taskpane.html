<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sender History</title>

  <!-- Office JavaScript API -->
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <!-- Microsoft Authentication Library (MSAL) - provides Nested App Auth -->
  <script src="https://alcdn.msauth.net/browser/3.28.0/js/msal-browser.min.js"></script>

  <link rel="stylesheet" href="taskpane.css"/>
</head>
<body>
  <header class="app-header">
    <div class="app-title">
      <span class="dot"></span>
      <span>Sender History</span>
    </div>
    <button id="refresh-btn" class="icon-btn" title="Refresh" aria-label="Refresh" hidden>&#x21bb;</button>
  </header>

  <section id="sender-bar" class="sender-bar" hidden>
    <div class="sender-name" id="sender-name"></div>
    <div class="sender-email" id="sender-email"></div>

    <div class="toggle" id="mode-toggle" role="tablist">
      <button class="toggle-btn active" id="mode-from" role="tab">From them</button>
      <button class="toggle-btn" id="mode-all" role="tab">All correspondence</button>
    </div>
  </section>

  <main id="content" class="content">
    <!-- States are injected here by taskpane.js -->
  </main>

  <footer class="app-footer">
    <span id="footer-note">Reads your mailbox via Microsoft 365. Nothing leaves your tenant.</span>
  </footer>

  <script src="taskpane.js"></script>
</body>
</html>
